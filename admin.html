<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin — MOUSLEIME PUB IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' },
            accent: { 400: '#fbbf24', 500: '#f59e0b' }
          }
        }
      }
    }
  </script>
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen">

  <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-600 to-accent-500 flex items-center justify-center">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <span class="font-bold text-lg">MOUSLEIME <span class="text-brand-600">PUB IA</span></span>
      <span class="ml-4 px-3 py-1 rounded-full bg-red-100 text-red-700 text-xs font-bold">SUPER ADMIN</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-gray-900">← Retour au site</a>
      <button onclick="doLogout()" class="px-4 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-sm font-semibold">Déconnexion</button>
    </div>
  </header>

  <main class="p-6 space-y-6">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="p-5 rounded-2xl bg-white border border-gray-200">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="users" class="w-5 h-5 text-brand-600"></i>
          <span class="text-sm text-gray-500">Total Utilisateurs</span>
        </div>
        <p class="text-3xl font-bold" id="total-users">—</p>
      </div>
      <div class="p-5 rounded-2xl bg-white border border-gray-200">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="coins" class="w-5 h-5 text-accent-500"></i>
          <span class="text-sm text-gray-500">Crédits distribués</span>
        </div>
        <p class="text-3xl font-bold" id="total-credits">—</p>
      </div>
      <div class="p-5 rounded-2xl bg-white border border-gray-200">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="wallet" class="w-5 h-5 text-green-600"></i>
          <span class="text-sm text-gray-500">Revenus totaux</span>
        </div>
        <p class="text-3xl font-bold" id="total-revenue">0 FCFA</p>
      </div>
      <div class="p-5 rounded-2xl bg-white border border-gray-200">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="megaphone" class="w-5 h-5 text-purple-600"></i>
          <span class="text-sm text-gray-500">Campagnes actives</span>
        </div>
        <p class="text-3xl font-bold" id="active-campaigns">—</p>
      </div>
    </div>

    <div class="rounded-2xl bg-white border border-gray-200 overflow-hidden">
      <div class="p-6 border-b border-gray-100 flex items-center justify-between">
        <h3 class="font-bold text-gray-900 text-lg">Tous les utilisateurs</h3>
        <button onclick="loadUsers()" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold">Rafraîchir</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Utilisateur</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Email</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Rôle</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Crédits</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Statut</th>
              <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="users-table">
            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="credits-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50 backdrop-blur">
    <div class="bg-white rounded-2xl w-full max-w-md p-6">
      <h3 class="font-bold text-lg mb-4">Ajouter / Retirer des crédits</h3>
      <input type="hidden" id="modal-user-id">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Nombre de crédits (négatif pour retirer)</label>
        <input type="number" id="credits-amount" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:border-brand-500 outline-none">
      </div>
      <div class="flex gap-3">
        <button onclick="closeCreditsModal()" class="flex-1 py-2 rounded-lg border border-gray-200 hover:bg-gray-50 font-semibold">Annuler</button>
        <button onclick="confirmAddCredits()" class="flex-1 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-semibold">Valider</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    // Configuration Supabase
    var SUPABASE_URL = 'https://thdcbdcevwjvfwiwnabb.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZGNiZGNldndqdmZ3aXduYWJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODA2MDMsImV4cCI6MjEwODg1NjYwM30.A5lNxHviZ5kw47J_Ds1_mWcAvrRNJvWgaI6qESPf77U';
    
    // Créer le client Supabase
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        storage: window.localStorage
      }
    });

    console.log('🔵 admin.html chargé, client Supabase créé');

    // Vérification de l'authentification
    async function checkAuth() {
      console.log(' Vérification de l\'authentification...');
      
      try {
        var result = await sb.auth.getUser();
        console.log('🟢 Résultat getUser:', result);
        
        var user = result.data.user;
        
        if (!user) {
          console.log('❌ Pas d\'utilisateur connecté, redirection vers connexion.html');
          window.location.href = 'connexion.html';
          return false;
        }

        console.log('🟢 Utilisateur connecté:', user.email);
        
        var profileResult = await sb.from('profiles').select('role').eq('id', user.id).single();
        console.log('🟢 Résultat profil:', profileResult);
        
        var profile = profileResult.data;
        
        if (!profile) {
          console.log('❌ Profil non trouvé, redirection vers dashboard.html');
          window.location.href = 'dashboard.html';
          return false;
        }
        
        console.log('🟢 Rôle détecté:', profile.role);
        
        if (profile.role !== 'super_admin') {
          console.log('❌ Rôle non super_admin, redirection vers dashboard.html');
          window.location.href = 'dashboard.html';
          return false;
        }
        
        console.log('✅ Accès Super Admin confirmé !');
        return true;
        
      } catch (err) {
        console.error('❌ Erreur dans checkAuth:', err);
        window.location.href = 'connexion.html';
        return false;
      }
    }

    async function loadUsers() {
      var table = document.getElementById('users-table');
      table.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Chargement...</td></tr>';

      try {
        var result = await sb
          .from('profiles')
          .select('id, email, full_name, role, is_active, credits(amount, subscription_type)')
          .order('created_at', { ascending: false });

        console.log('🟢 Résultat loadUsers:', result);

        if (result.error) {
          console.error('❌ Erreur:', result.error);
          table.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-600">Erreur: ' + result.error.message + '</td></tr>';
          return;
        }

        var users = result.data || [];
        document.getElementById('total-users').textContent = users.length;
        
        var totalCredits = 0;
        users.forEach(function(u) {
          if (u.credits && u.credits.length > 0) {
            totalCredits += u.credits[0].amount || 0;
          }
        });
        document.getElementById('total-credits').textContent = totalCredits.toLocaleString();

        if (users.length === 0) {
          table.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Aucun utilisateur</td></tr>';
          return;
        }

        var html = '';
        users.forEach(function(user) {
          var credits = (user.credits && user.credits[0]) ? user.credits[0].amount : 0;
          var subscription = (user.credits && user.credits[0]) ? user.credits[0].subscription_type : 'free';
          var initial = user.full_name ? user.full_name.charAt(0).toUpperCase() : (user.email ? user.email.charAt(0).toUpperCase() : 'U');
          
          var roleClass = user.role === 'super_admin' ? 'bg-red-100 text-red-700' : (user.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700');
          var statusClass = user.is_active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
          var statusText = user.is_active ? 'Actif' : 'Suspendu';
          var iconAction = user.is_active ? 'ban' : 'check-circle';
          var colorAction = user.is_active ? 'text-red-600' : 'text-green-600';
          
          html += '<tr class="hover:bg-gray-50">';
          html += '<td class="px-6 py-4"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-accent-500 flex items-center justify-center text-white font-bold">' + initial + '</div><div><p class="font-semibold text-gray-900">' + (user.full_name || 'Non renseigné') + '</p><p class="text-xs text-gray-500">Formule: ' + subscription + '</p></div></div></td>';
          html += '<td class="px-6 py-4 text-sm text-gray-700">' + (user.email || '—') + '</td>';
          html += '<td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ' + roleClass + '">' + user.role + '</span></td>';
          html += '<td class="px-6 py-4 font-semibold text-gray-900">' + credits + '</td>';
          html += '<td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ' + statusClass + '">' + statusText + '</span></td>';
          html += '<td class="px-6 py-4 text-right"><button onclick="openCreditsModal(\'' + user.id + '\')" class="p-2 rounded-lg hover:bg-gray-100" title="Modifier crédits"><i data-lucide="plus-circle" class="w-4 h-4 text-green-600"></i></button><button onclick="toggleUserStatus(\'' + user.id + '\', ' + user.is_active + ')" class="p-2 rounded-lg hover:bg-gray-100" title="' + statusText + '"><i data-lucide="' + iconAction + '" class="w-4 h-4 ' + colorAction + '"></i></button></td>';
          html += '</tr>';
        });
        
        table.innerHTML = html;
        lucide.createIcons();
        
      } catch (err) {
        console.error('❌ Erreur:', err);
        table.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-red-600">Erreur: ' + err.message + '</td></tr>';
      }
    }

    function openCreditsModal(userId) {
      document.getElementById('modal-user-id').value = userId;
      document.getElementById('credits-amount').value = '';
      document.getElementById('credits-modal').classList.remove('hidden');
      document.getElementById('credits-modal').classList.add('flex');
    }

    function closeCreditsModal() {
      document.getElementById('credits-modal').classList.add('hidden');
      document.getElementById('credits-modal').classList.remove('flex');
    }

    async function confirmAddCredits() {
      var userId = document.getElementById('modal-user-id').value;
      var amount = parseInt(document.getElementById('credits-amount').value);

      if (!amount || amount === 0) {
        alert('Veuillez entrer un nombre valide');
        return;
      }

      try {
        var currentResult = await sb.from('credits').select('amount').eq('user_id', userId).single();
        var current = currentResult.data ? currentResult.data.amount : 0;
        var newAmount = current + amount;

        await sb.from('credits').update({ amount: newAmount }).eq('user_id', userId);

        await sb.from('transactions').insert({
          user_id: userId,
          type: 'bonus',
          amount: amount,
          credits_before: current,
          credits_after: newAmount,
          description: amount > 0 ? 'Crédits ajoutés par Super Admin' : 'Crédits retirés par Super Admin',
          amount_fcf: 0
        });

        alert((amount > 0 ? '+' : '') + amount + ' crédits appliqués avec succès !');
        closeCreditsModal();
        loadUsers();
      } catch (err) {
        alert('Erreur: ' + err.message);
      }
    }

    async function toggleUserStatus(userId, currentStatus) {
      var newStatus = !currentStatus;
      var action = newStatus ? 'activer' : 'suspendre';
      if (confirm('Voulez-vous vraiment ' + action + ' ce compte ?')) {
        await sb.from('profiles').update({ is_active: newStatus }).eq('id', userId);
        loadUsers();
      }
    }

    async function doLogout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    // Démarrage
    (async function() {
      var isAdmin = await checkAuth();
      if (isAdmin) {
        loadUsers();
      }
    })();
  </script>
</body>
</html>
