<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — MOUSLEIME PUB IA</title>
  <meta name="description" content="Une question sur MOUSLEIME PUB IA ? Écrivez-nous, nous vous répondons rapidement." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-100">
    <nav class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between" aria-label="Navigation">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-600 to-accent-500 flex items-center justify-center"><i data-lucide="sparkles" class="w-5 h-5 text-white" aria-hidden="true"></i></span>
        <span class="font-bold text-lg text-gray-900">MOUSLEIME <span class="text-brand-600">PUB IA</span></span>
      </a>
      <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-brand-600">← Retour à l’accueil</a>
    </nav>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-12 grid md:grid-cols-5 gap-10">
    <section class="md:col-span-2">
      <h1 class="text-3xl font-bold text-gray-900">Contactez-nous</h1>
      <p class="mt-3 text-gray-600">Une question, un problème de paiement, une suggestion ? Envoyez-nous un message, nous vous répondons dès que possible.</p>
      <ul class="mt-8 space-y-4 text-sm text-gray-700">
        <li data-legal-row class="flex items-center gap-3"><i data-lucide="mail" class="w-5 h-5 text-brand-600" aria-hidden="true"></i><a data-legal="email" href="#" class="hover:underline"></a></li>
        <li data-legal-row class="flex items-center gap-3"><i data-lucide="phone" class="w-5 h-5 text-brand-600" aria-hidden="true"></i><span data-legal="phone"></span></li>
        <li data-legal-row class="flex items-center gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-brand-600" aria-hidden="true"></i><span data-legal="address"></span></li>
      </ul>
    </section>

    <section class="md:col-span-3 card">
      <form id="contact-form" class="space-y-4" novalidate>
        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="name" class="label">Nom</label>
            <input type="text" id="name" required maxlength="120" autocomplete="name" class="input" />
          </div>
          <div>
            <label for="email" class="label">Email</label>
            <input type="email" id="email" required maxlength="200" autocomplete="email" class="input" />
          </div>
        </div>
        <div>
          <label for="subject" class="label">Sujet</label>
          <select id="subject" class="input">
            <option>Question générale</option>
            <option>Paiement / crédits</option>
            <option>Problème technique</option>
            <option>Partenariat</option>
            <option>Autre</option>
          </select>
        </div>
        <div>
          <label for="message" class="label">Message</label>
          <textarea id="message" rows="6" required minlength="5" maxlength="5000" class="input resize-none"></textarea>
        </div>
        <!-- Champ piège anti-spam : ne doit jamais être rempli par un humain -->
        <div class="hidden" aria-hidden="true"><label>Ne pas remplir<input type="text" id="website" tabindex="-1" autocomplete="off" /></label></div>

        <button type="submit" id="submit-btn" class="btn-primary w-full py-3"><i data-lucide="send" class="w-4 h-4" aria-hidden="true"></i><span>Envoyer le message</span></button>
        <div id="error-message" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm" role="alert"></div>
        <div id="success-message" class="hidden p-3 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm" role="status"></div>
      </form>
    </section>
  </main>

  <footer class="py-8 text-center text-sm text-gray-500">
    © <span id="year"></span> MOUSLEIME PUB IA ·
    <a href="a-propos.html" class="hover:text-gray-800">À propos</a> ·
    <a href="cgu.html" class="hover:text-gray-800">CGU</a> ·
    <a href="confidentialite.html" class="hover:text-gray-800">Confidentialité</a> ·
    <a href="mentions-legales.html" class="hover:text-gray-800">Mentions légales</a>
  </footer>

  <script src="assets/vendor/supabase.js"></script>
  <script src="assets/vendor/lucide.min.js"></script>
  <script src="config.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();
      App.fillLegal();
      App.icons();

      var form = document.getElementById('contact-form');
      var btn = document.getElementById('submit-btn');
      var errBox = document.getElementById('error-message');
      var okBox = document.getElementById('success-message');

      // Pré-remplit nom et email pour un utilisateur connecté.
      App.sb.auth.getUser().then(async function (r) {
        if (!r.data || !r.data.user) return;
        var p = await App.sb.from('profiles').select('full_name, email').eq('id', r.data.user.id).maybeSingle();
        if (p.data) {
          document.getElementById('name').value = p.data.full_name || '';
          document.getElementById('email').value = p.data.email || r.data.user.email || '';
        }
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errBox.classList.add('hidden'); okBox.classList.add('hidden');
        if (document.getElementById('website').value) { okBox.textContent = 'Merci, votre message a bien été envoyé.'; okBox.classList.remove('hidden'); return; }

        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var subject = document.getElementById('subject').value;
        var message = document.getElementById('message').value.trim();

        if (!name || !email || message.length < 5) { errBox.textContent = 'Veuillez renseigner votre nom, votre email et un message.'; errBox.classList.remove('hidden'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { errBox.textContent = 'Adresse email invalide.'; errBox.classList.remove('hidden'); return; }

        btn.disabled = true;
        var res = await App.sb.from('contact_messages').insert({ name: name, email: email, subject: subject, message: message });
        if (res.error) {
          errBox.textContent = 'Impossible d’envoyer votre message pour le moment. Réessayez dans un instant.';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          return;
        }
        okBox.textContent = 'Merci ! Votre message a bien été envoyé. Nous vous répondons rapidement.';
        okBox.classList.remove('hidden');
        form.reset();
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
