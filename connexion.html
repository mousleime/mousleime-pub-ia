<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — MOUSLEIME PUB IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' },
            accent: { 400: '#fbbf24', 500: '#f59e0b' }
          }
        }
      }
    }
  </script>
  <style>
    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .auth-bg {
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
        linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%);
    }
  </style>
</head>
<body class="font-sans text-gray-800 bg-gray-50 min-h-screen">

  <div class="min-h-screen grid lg:grid-cols-2">
    <div class="hidden lg:flex auth-bg relative overflow-hidden p-12 flex-col justify-between text-white">
      <div>
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-lg bg-white/10 backdrop-blur flex items-center justify-center border border-white/20">
            <i data-lucide="sparkles" class="w-5 h-5 text-accent-400"></i>
          </div>
          <span class="font-bold text-lg">MOUSLEIME <span class="text-accent-400">PUB IA</span></span>
        </a>
      </div>
      <div class="space-y-8">
        <div>
          <h2 class="text-4xl font-bold leading-tight">Content de vous <span class="gradient-text">revoir</span></h2>
          <p class="mt-4 text-lg text-brand-100">Accédez à votre tableau de bord et continuez à créer des publicités qui convertissent.</p>
        </div>
      </div>
      <p class="text-sm text-brand-200">Fait avec ❤️ au Bénin 🇧</p>
    </div>
    
    <div class="flex items-center justify-center p-6 sm:p-12">
      <div class="w-full max-w-md">
        <a href="index.html" class="lg:hidden flex items-center gap-2 mb-8">
          <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-600 to-accent-500 flex items-center justify-center">
            <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
          </div>
          <span class="font-bold text-lg">MOUSLEIME <span class="text-brand-600">PUB IA</span></span>
        </a>
        
        <div class="mb-8">
          <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Bon retour parmi nous 👋</h1>
          <p class="mt-2 text-gray-600">Pas encore de compte ? <a href="inscription.html" class="font-semibold text-brand-600 hover:text-brand-700">Inscrivez-vous gratuitement</a></p>
        </div>
        
        <form id="login-form" class="space-y-4" onsubmit="return false;">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Adresse email</label>
            <input type="email" id="email" required placeholder="vous@exemple.com"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
          </div>
          
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
            </div>
            <input type="password" id="password" required placeholder="••••••••"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition">
          </div>
          
          <div class="flex items-center gap-2">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-brand-600 focus:ring-brand-500">
            <label for="remember" class="text-sm text-gray-600">Se souvenir de moi</label>
          </div>
          
          <button type="submit" id="submit-btn" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition shadow-lg">
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
            Se connecter
          </button>
          
          <div id="error-message" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>
          <div id="success-message" class="hidden p-3 rounded-xl bg-green-50 border border-green-200 text-green-700 text-sm"></div>
        </form>
        
        <p class="mt-6 text-center text-xs text-gray-500">
          🔒 Connexion sécurisée par chiffrement SSL
        </p>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    console.log('🔵 connexion.html chargé');
    
    var SUPABASE_URL = 'https://thdcbdcevwjvfwiwnabb.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZGNiZGNldndqdmZ3aXduYWJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODA2MDMsImV4cCI6MjEwODg1NjYwM30.A5lNxHviZ5kw47J_Ds1_mWcAvrRNJvWgaI6qESPf77U';
    
    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        storage: window.localStorage
      }
    });
    
    console.log('🟢 Client Supabase créé');

    // Fonction de connexion
    async function handleLogin(event) {
      console.log(' Formulaire soumis');
      
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var submitBtn = document.getElementById('submit-btn');
      var errorDiv = document.getElementById('error-message');
      var successDiv = document.getElementById('success-message');
      
      errorDiv.classList.add('hidden');
      successDiv.classList.add('hidden');
      
      if (!email || !password) {
        errorDiv.textContent = '❌ Veuillez remplir tous les champs';
        errorDiv.classList.remove('hidden');
        return false;
      }
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Connexion en cours...';
      
      try {
        console.log('🔵 Tentative de connexion avec:', email);
        
        var result = await sb.auth.signInWithPassword({
          email: email,
          password: password
        });
        
        console.log('🟢 Résultat connexion:', result);
        
        if (result.error) {
          throw result.error;
        }
        
        var user = result.data.user;
        console.log('✅ Utilisateur connecté:', user.email);
        
        successDiv.textContent = '✅ Connexion réussie ! Vérification du rôle...';
        successDiv.classList.remove('hidden');
        
        // Récupérer le profil pour connaître le rôle
        var profileResult = await sb.from('profiles').select('role, is_active').eq('id', user.id).single();
        var profile = profileResult.data;
        
        console.log('🟢 Profil récupéré:', profile);
        
        if (profile && !profile.is_active) {
          await sb.auth.signOut();
          throw new Error('Votre compte a été suspendu. Contactez l\'administrateur.');
        }
        
        // Redirection selon le rôle
        setTimeout(function() {
          if (profile && profile.role === 'super_admin') {
            console.log('🚀 Redirection Super Admin → admin.html');
            window.location.href = 'admin.html';
          } else {
            console.log('🚀 Redirection User → dashboard.html');
            window.location.href = 'dashboard.html';
          }
        }, 800);
        
      } catch (err) {
        console.error('❌ Erreur:', err);
        errorDiv.textContent = '❌ ' + (err.message || 'Email ou mot de passe incorrect.');
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="arrow-right" class="w-5 h-5"></i> Se connecter';
        lucide.createIcons();
      }
      
      return false;
    }

    // Attacher l'event listener de manière fiable
    var form = document.getElementById('login-form');
    if (form) {
      form.addEventListener('submit', handleLogin);
      form.onsubmit = handleLogin;
      console.log('🟢 Event listener attaché au formulaire');
    } else {
      console.error('❌ Formulaire non trouvé !');
    }

    console.log('✅ Script connexion.html prêt');
  </script>
</body>
</html>
